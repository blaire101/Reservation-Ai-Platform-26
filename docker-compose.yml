services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AI_MODE: mock
      RETRIEVAL_BACKEND: keyword
      PIPELINE_ENGINE: pandas
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      AI_MODE: mock
      RETRIEVAL_BACKEND: keyword
      PIPELINE_ENGINE: pandas
